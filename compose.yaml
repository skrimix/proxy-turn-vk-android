name: wdtt

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: wdtt-server:local
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: "1"
    ports:
      - "${WDTT_PUBLIC_PORT:-56000}:56000/udp"
      - "${WDTT_PUBLIC_PORT:-56000}:56000/tcp"
      - "${WDTT_RAW_PORT:-56003}:${WDTT_RAW_PORT:-56003}/udp"
    environment:
      WDTT_PASSWORD: "${WDTT_PASSWORD:?Set WDTT_PASSWORD in .env}"
      WDTT_RAW_PORT: "${WDTT_RAW_PORT:-56003}"
      WDTT_DNS: "${WDTT_DNS:-1.1.1.1,1.0.0.1}"
      WDTT_ADMIN_ID: "${WDTT_ADMIN_ID:-}"
      WDTT_BOT_TOKEN: "${WDTT_BOT_TOKEN:-}"
    volumes:
      - wdtt-data:/etc/wdtt
    stop_grace_period: 10s

volumes:
  wdtt-data:
